name: lieneurons
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # PyTorch w/ CUDA 12.8 wheels — pinned to cu128 builds so one env works on
      # RTX 30-series (sm_86), 40-series (sm_89), and 50-series (sm_120) GPUs.
      # cu128 also needs only driver r525+, unlike cu130 wheels (r580+).
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128
      - torchvision==0.26.0+cu128
      # core deps (from docker/LieNeurons/Dockerfile)
      - numpy<2
      - scipy
      - matplotlib
      - tensorboardX
      - wandb
      - einops
      - torchdiffeq
      - pytest
      - pyyaml
      - tqdm
      # optional: only needed for experiment/so3_bch_* baselines
      # - e3nn
      # - emlp
